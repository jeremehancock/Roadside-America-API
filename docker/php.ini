; PHP settings for the Roadside America container.
;
; The official image ships no php.ini, so without this file PHP falls back to its
; built-in defaults, which print warnings and notices into the page. For a JSON
; API that corrupts the response: one notice in front of the JSON and every
; client fails to parse it.

; Report problems to the container log (Coolify shows it), never to the client.
display_errors = Off
display_startup_errors = Off
log_errors = On
error_reporting = E_ALL

; Keep the X-Powered-By header. The weekly PHP currency check reads the running
; version from it.
expose_php = On

; Hardening against the PHP2Shell family of bugs, which are reached through
; multipart (file upload) request parsing before any application code runs. The
; API is GET-only and nothing accepts uploads, so none of this removes a feature.
; It is defence in depth, not the fix: the fix is a patched PHP.
session.upload_progress.enabled = 0
file_uploads = Off
post_max_size = 64K
